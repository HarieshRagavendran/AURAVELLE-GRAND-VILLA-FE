<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Grand Auravelle — Admin Login</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b1713'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' fill='%23c6a66a' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --obsidian: #0b1713;
      --forest: #10231d;
      --card: #142922;
      --gold: #c6a66a;
      --gold-light: #dfc48d;
      --ivory: #f3eee4;
      --stone: #e5dfd3;
    }
    body {
      background: var(--obsidian);
      color: var(--ivory);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-box {
      background: var(--card);
      border: 1px solid rgba(198, 166, 106, 0.3);
      padding: 2.8rem 2.2rem;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      text-align: center;
    }
    .brand-mark {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      letter-spacing: 0.18em;
      color: var(--gold);
      margin-bottom: 0.4rem;
    }
    .brand-sub {
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--stone);
      opacity: 0.8;
      margin-bottom: 2.2rem;
    }
    .form-group {
      text-align: left;
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--stone);
      margin-bottom: 0.5rem;
    }
    .form-group input {
      width: 100%;
      background: rgba(11, 23, 19, 0.8);
      border: 1px solid rgba(198, 166, 106, 0.4);
      padding: 0.85rem 1rem;
      font-size: 0.95rem;
      color: var(--ivory);
      border-radius: 6px;
      outline: none;
      transition: border-color 0.3s;
    }
    .form-group input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(198, 166, 106, 0.2);
    }
    .btn-login {
      width: 100%;
      background: var(--gold);
      color: var(--obsidian);
      border: none;
      padding: 0.9rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-login:hover {
      background: var(--gold-light);
      transform: translateY(-1px);
    }
    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .error-box {
      display: none;
      background: rgba(244, 67, 54, 0.15);
      border: 1px solid #f44336;
      color: #ff8a80;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.8rem;
      margin-bottom: 1.2rem;
    }
    .back-home {
      display: inline-block;
      margin-top: 1.8rem;
      color: var(--stone);
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      transition: color 0.3s;
    }
    .back-home:hover {
      color: var(--gold);
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h1 class="brand-mark">AURAVELLE</h1>
    <div class="brand-sub">Management Portal</div>

    <div class="error-box" id="error-box"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="password">Admin Password</label>
        <input type="password" id="password" required placeholder="Enter administrative password" autocomplete="current-password" autofocus />
      </div>

      <button type="submit" class="btn-login" id="login-btn">Secure Login</button>
    </form>

    <a href="index.html" class="back-home">← Back to Main Website</a>
  </div>

  <script>
    const API_BASE = window.location.origin.includes(':3000')
      ? window.location.origin + '/api'
      : (window.location.hostname === 'localhost' ? 'http://localhost:3000/api' : '/api');

    const form = document.getElementById('login-form');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('login-btn');
    const errorBox = document.getElementById('error-box');

    // Auto-redirect if token is already active
    const existingToken = localStorage.getItem('auravelle_admin_token');
    if (existingToken) {
      window.location.href = 'admin.html';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = passwordInput.value.trim();
      if (!password) return;

      errorBox.style.display = 'none';
      loginBtn.disabled = true;
      loginBtn.textContent = 'Verifying...';

      try {
        const response = await fetch(`${API_BASE}/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await response.json();

        if (response.ok && data.token) {
          localStorage.setItem('auravelle_admin_token', data.token);
          window.location.href = 'admin.html';
        } else {
          showError(data.error || 'Invalid credentials. Access denied.');
        }
      } catch (err) {
        // Fallback for direct static testing if backend is offline
        if (password === 'auravelle999') {
          localStorage.setItem('auravelle_admin_token', 'offline-dev-token');
          window.location.href = 'admin.html';
        } else {
          showError('Cannot connect to backend server. Make sure server is running on port 3000.');
        }
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Secure Login';
      }
    });

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }
  </script>
</body>
</html>
